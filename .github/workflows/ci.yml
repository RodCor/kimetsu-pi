name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: kimetsu-2.11.0-x86_64-unknown-linux-gnu-lean.tar.gz
            sha256: bc7ed801647d1c86b9068886df8d23b05c31c0de5da05eb609ead6912083a832
          - os: macos-15
            asset: kimetsu-2.11.0-aarch64-apple-darwin-lean.tar.gz
            sha256: f57cea91c5f42b3772eaf58550556c09e2ce827a6b802fa5fe0b2c9f7e14a6aa
          - os: windows-latest
            asset: kimetsu-2.11.0-x86_64-pc-windows-msvc-lean.zip
            sha256: fe27dc19e1703a55d29b006b350bfe69b974c510b54577a90b5ec6972a6a813c
    runs-on: ${{ matrix.os }}
    env:
      KIMETSU_INTEGRATION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      # Brain and peer-network integration run against the published Kimetsu v2.11.0 CLI.
      - name: Install checksum-pinned Kimetsu CLI in runner temp
        shell: pwsh
        env:
          CLI_ASSET: ${{ matrix.asset }}
          CLI_SHA256: ${{ matrix.sha256 }}
        run: |
          $cliDir = Join-Path $env:RUNNER_TEMP "kimetsu-cli"
          New-Item -ItemType Directory -Path $cliDir | Out-Null
          $archive = Join-Path $cliDir $env:CLI_ASSET
          Invoke-WebRequest "https://github.com/RodCor/kimetsu/releases/download/v2.11.0/$env:CLI_ASSET" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CLI_SHA256) { throw "Kimetsu archive checksum mismatch" }
          if ($archive.EndsWith('.zip')) {
            Expand-Archive -LiteralPath $archive -DestinationPath $cliDir
          } else {
            tar -xzf $archive -C $cliDir
            if ($LASTEXITCODE -ne 0) { throw "Kimetsu archive extraction failed" }
          }
          $binaries = @(Get-ChildItem -LiteralPath $cliDir -Recurse -File | Where-Object { $_.Name -in @('kimetsu', 'kimetsu.exe') })
          if ($binaries.Count -ne 1) { throw "Expected exactly one Kimetsu executable" }
          "KIMETSU_TEST_BINARY=$($binaries[0].FullName)" >> $env:GITHUB_ENV
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run

  required-checks:
    name: required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
